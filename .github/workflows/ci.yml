name: CI

# Runs on pull requests and pushes to develop.
# main is production: it also gets CI, but deploys from main need
# the founder's explicit sign-off (see README).
on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            api/package-lock.json

      - name: Build + test site
        run: |
          if [ -f site/package.json ]; then
            cd site && npm ci && npm run build && npm test --if-present
          else
            echo "site/ not scaffolded yet — skipping"
          fi

      - name: Build + test API
        run: |
          if [ -f api/package.json ]; then
            cd api && npm ci && npm run build && npm test --if-present
          else
            echo "api/ not scaffolded yet — skipping"
          fi

  # Lighthouse CI against the Cloudflare Pages preview URL.
  # Wired up once the repo → Pages connection (T4) produces preview URLs.
  # Budgets live in .lighthouserc.json (from CONSTRAINTS.md §5).
  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.PREVIEW_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @lhci/cli
      - run: lhci autorun --collect.url="$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ vars.PREVIEW_URL }}
