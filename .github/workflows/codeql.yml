name: CodeQL

# Static analysis for JavaScript/TypeScript. Runs on PRs and pushes to
# develop/main, plus a weekly scheduled scan.
on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
