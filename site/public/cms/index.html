<!doctype html>
<html lang="en-ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content Studio — Brimwood Innovation</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; margin: 0; background: #F6F8F7; }
    .cms-header { background: #0A3D2B; color: #fff; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    .cms-header a { color: #fff; text-decoration: none; font-size: 14px; }
    .cms-header strong { font-size: 18px; }
  </style>
</head>
<body>
  <div class="cms-header">
    <strong>Brimwood Content Studio</strong>
    <a href="/admin">← Back to admin</a>
  </div>
  <!-- Decap CMS: MIT-licensed. Config at /cms/config.yml. -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="/cms/editorial.js"></script>
  <script>
    /* Brimwood Content Studio: hide Decap's attribution credit on the login
     * screen. Scoped tightly: only runs while the "Login with GitHub" button
     * is visible, and only hides the absolutely-positioned credit pinned to
     * the bottom of the login view. Disconnects once done. */
    (function () {
      var obs;
      function hide() {
        var onLogin = Array.prototype.some.call(
          document.querySelectorAll("button"),
          function (b) { return /login with github/i.test(b.textContent || ""); }
        );
        if (!onLogin) { if (obs) obs.disconnect(); return; }
        var spans = document.querySelectorAll("span");
        for (var i = 0; i < spans.length; i++) {
          var cs = getComputedStyle(spans[i]);
          if (cs.position === "absolute" && cs.bottom === "10px") {
            spans[i].style.display = "none";
            if (obs) obs.disconnect();
            return;
          }
        }
      }
      obs = new MutationObserver(hide);
      obs.observe(document.documentElement, { childList: true, subtree: true });
      hide();
    })();
  </script>
</body>
</html>
