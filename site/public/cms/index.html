<!doctype html>
<html lang="en-ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content Studio — Brimwood Innovation</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; margin: 0; background: #F6F8F7; }
    .cms-header { background: #0A3D2B; color: #fff; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    .cms-header a { color: #fff; text-decoration: none; font-size: 14px; }
    .cms-header strong { font-size: 18px; }
    /* Brimwood Content Studio: hide Decap's attribution credit on the login
     * screen. Decap hardcodes it (no config off-switch) and only renders it
     * alongside a custom logo. The credit is the last direct-child span of
     * the login section; the logo wrapper is the first. */
    section:has(> span > img[alt="Logo"]) > span:last-of-type {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="cms-header">
    <strong>Brimwood Content Studio</strong>
    <a href="/admin">← Back to admin</a>
  </div>
  <!-- Decap CMS: MIT-licensed. Config at /cms/config.yml. -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="/cms/editorial.js"></script>
</body>
</html>
