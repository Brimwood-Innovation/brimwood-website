# Decap CMS config (T26, expanded Phase A, testimonials Phase B): blog posts,
# academy content, editable pages, site settings, navigation, homepage
# sections, and member testimonials.
# Auth via the GitHub OAuth worker at /api/oauth.

# Brimwood branding on the login screen (replaces the Decap logo).
logo_url: /img/brimwood-logo-colour.svg

backend:
  name: github
  repo: Brimwood-Innovation/brimwood-website
  branch: develop
  base_url: https://brimwood-api.adamsayani.workers.dev
  auth_endpoint: /api/oauth/auth
  api_root: https://api.github.com

# Editorial guardrails (T27) are enforced via custom widgets + pre-publish checks.
# See: site/public/cms/editorial.js

media_folder: "site/public/img/uploads"
public_folder: "/img/uploads"

collections:
  # Field names must match the Astro content schema in site/src/content/config.ts
  # (description, publishDate, pillar, tags, author, draft) or the build drops
  # the entry.
  - name: "blog"
    label: "Blog Posts"
    folder: "site/src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", hint: "One or two short sentences. Appears in lists and SEO." }
      - { label: "Publish date", name: "publishDate", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Pillar", name: "pillar", widget: "select", options: ["micro-business", "ai-in-practice", "owner-mindset", "members-hub"] }
      - { label: "Tags", name: "tags", widget: "list", required: false, field: { label: "Tag", name: "tag", widget: "string" } }
      - { label: "Author", name: "author", widget: "string", default: "Brimwood Team" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, hint: "Keep on until the founder approves." }
      - { label: "Body", name: "body", widget: "markdown", hint: "Short sentences. Canadian spelling. No hype." }

  - name: "courses"
    label: "Courses"
    label_singular: "Course"
    folder: "site/src/content/courses"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{status}})"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Tagline", name: "tagline", widget: "string" }
      - { label: "Level", name: "level", widget: "select", options: ["foundations", "builder", "operator"] }
      - { label: "Visibility", name: "visibility", widget: "select", options: ["members", "public"], default: "members" }
      - { label: "Status", name: "status", widget: "select", options: ["draft", "published", "archived"], default: "draft", hint: "Drafts never appear on the site." }
      - { label: "Description", name: "description", widget: "markdown" }
      - label: "Modules"
        name: "modules"
        widget: "list"
        summary: "{{fields.title}}"
        fields:
          - { label: "Module title", name: "title", widget: "string" }
          - label: "Lessons"
            name: "lessons"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Lesson title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "markdown", hint: "Short sentences. Canadian spelling. No hype." }
              - { label: "Free preview", name: "is_preview", widget: "boolean", default: false, hint: "Preview lessons are visible without signing in." }
              - { label: "Status", name: "status", widget: "select", options: ["draft", "published"], default: "published" }
              - { label: "Duration (minutes)", name: "duration_minutes", widget: "number", required: false, min: 1 }
              - { label: "Video R2 key", name: "video_r2_key", widget: "string", required: false, hint: "Path of the video in the brimwood-media bucket." }

  - name: "pages"
    label: "Pages"
    folder: "site/src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "Unique URL path, e.g. 'our-story'. Lowercase letters and hyphens only." }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "One or two short sentences. Appears in lists and SEO." }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, hint: "Keep on until the founder approves." }
      - { label: "Body", name: "body", widget: "markdown", hint: "Short sentences. Canadian spelling. No hype." }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "site/src/content/settings.json"
        fields:
          - { label: "Site title", name: "site_title", widget: "string" }
          - { label: "Hero headline", name: "hero_headline", widget: "string" }
          - { label: "Hero subtext", name: "hero_subtext", widget: "text", hint: "Short sentences. Canadian spelling." }
          - { label: "CTA text", name: "cta_text", widget: "string" }
          - { label: "CTA link", name: "cta_link", widget: "string", hint: "Anchor or URL, e.g. '#introduce'." }
          - { label: "Announcement bar", name: "announcement_bar", widget: "string", required: false, hint: "Optional. Leave empty to hide the bar." }
          - { label: "Contact email", name: "contact_email", widget: "string" }

  - name: "navigation"
    label: "Navigation"
    files:
      - label: "Menus"
        name: "menus"
        file: "site/src/content/navigation.json"
        fields:
          - label: "Header links"
            name: "header_links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string", hint: "Site path or full URL." }
          - label: "Footer links"
            name: "footer_links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string", hint: "Site path or full URL." }
          - { label: "Footer tagline", name: "footer_tagline", widget: "string" }

  - name: "homepage"
    label: "Homepage"
    files:
      - label: "Homepage Sections"
        name: "sections"
        file: "site/src/content/homepage.json"
        fields:
          - label: "Sections"
            name: "sections"
            widget: "list"
            hint: "Order and toggle homepage sections. Headings use sentence case."
            fields:
              - { label: "Type", name: "type", widget: "select", options: ["hero", "features", "testimonials", "cta", "stats"] }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Subheading", name: "subheading", widget: "text", required: false }
              - { label: "Enabled", name: "enabled", widget: "boolean", default: true }

  - name: "testimonials"
    label: "Testimonials"
    label_singular: "Testimonial"
    folder: "site/src/content/testimonials"
    create: true
    slug: "{{slug}}"
    summary: "{{attribution}}"
    fields:
      - { label: "Quote", name: "quote", widget: "text", hint: "The member's words. Short sentences. Canadian spelling. No hype." }
      - { label: "Attribution", name: "attribution", widget: "string", hint: "Initials + role only, never full names. E.g. 'M., builder since 2026'." }
      - { label: "Role", name: "role", widget: "string", required: false, hint: "E.g. 'Academy member'. Optional." }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Featured quotes appear first on the wall." }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
